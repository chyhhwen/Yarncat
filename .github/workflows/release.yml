name: 打包 Windows、macOS 安裝檔

on:
  # 推一個 v 或 V 開頭的標籤（例如 V0.1）就會自動觸發
  push:
    tags: ['v*', 'V*']
  # 也可以在 Actions 頁面按「Run workflow」手動執行
  workflow_dispatch:
    inputs:
      tag:
        description: '版本標籤（例如 V0.1）'
        required: true

permissions:
  contents: write   # 要能建立 Release 並上傳安裝檔

jobs:
  build:
    strategy:
      fail-fast: false   # 一個平台失敗，另一個照樣打包
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            # 一個 .dmg 同時支援 M 系列和 Intel Mac
            args: '--target universal-apple-darwin --bundles dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '毛球貓 ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            Windows：下載 YarnCat_x.x.x_x64-setup.exe，雙擊安裝。
            macOS（測試版）：下載 YarnCat_x.x.x_universal.dmg，把 YarnCat 拖進「應用程式」。第一次打開前要在「終端機」執行 `xattr -cr /Applications/YarnCat.app`（安裝檔沒有簽章）。有問題請到 Issues 回報。
          releaseDraft: true
          args: ${{ matrix.args }}

      # 沒有 Mac 可以測，所以在這台 macOS 機器上直接執行 app、拍一張螢幕截圖。
      # 直接跑執行檔（不用 open），閃退時才看得到它印出的錯誤。
      - name: macOS 試跑並截圖
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          BIN=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1)
          echo "執行 $BIN"
          RUST_BACKTRACE=1 "$BIN" > macos-app.log 2>&1 &
          PID=$!
          sleep 15
          screencapture -x macos-screenshot.png || true
          if kill -0 $PID 2>/dev/null; then
            echo "app 還在執行"
            kill $PID || true
          else
            echo "::error::app 一打開就結束了，原因看下面的輸出"
            echo "===== app 輸出 ====="
            cat macos-app.log
            echo "===== 當機報告 ====="
            for f in ~/Library/Logs/DiagnosticReports/*; do
              case "$f" in *[Yy]arn[Cc]at*|*yarncat*) echo "--- $f"; head -120 "$f";; esac
            done
            exit 1
          fi

      # 截圖放在這次執行的頁面最下面「Artifacts」，登入 GitHub 就能下載
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'macos-latest'
        with:
          name: macos-screenshot
          path: |
            macos-screenshot.png
            macos-app.log
          if-no-files-found: ignore
