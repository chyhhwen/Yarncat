name: 打包 Windows 安裝檔

# 推一個 v 或 V 開頭的標籤（例如 v0.1.0）就會觸發
on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write   # 要能建立 Release 並上傳安裝檔

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '毛球貓 ${{ github.ref_name }}'
          releaseBody: '下載 YarnCat_x.x.x_x64-setup.exe，雙擊安裝。'
          releaseDraft: true
