name: 打包 Windows 安裝檔

on:
  # 推一個 v 或 V 開頭的標籤（例如 V0.1）就會自動觸發
  push:
    tags: ['v*', 'V*']
  # 也可以在 Actions 頁面按「Run workflow」手動執行
  workflow_dispatch:
    inputs:
      tag:
        description: '版本標籤（例如 V0.1）'
        required: true

permissions:
  contents: write   # 要能建立 Release 並上傳安裝檔

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '毛球貓 ${{ inputs.tag || github.ref_name }}'
          releaseBody: '下載 YarnCat_x.x.x_x64-setup.exe，雙擊安裝。'
          releaseDraft: true
