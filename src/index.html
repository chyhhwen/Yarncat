/* 客人貓：沿用家裡的貓的姿勢，用牠自己的毛色畫。只會走進來、跟主人家的貓碰鼻子、坐坐、舔毛、走走、打盹，
   待夠了就從原來那一邊走回去；可以摸，不能拎，不用家具。 */
const GUEST_PETTABLE = ['sit', 'lick', 'walk', 'sleep', 'wait', 'pet'];
function guestSet(s, dur = 60) { guest.state = s; guest.t = 0; guest.dur = dur; guest.frame = 0; }
function guestIdle() {                                 // 客人閒著：待夠了（或主人不見了）就回家，不然坐坐、舔毛、走走、打個盹
  const g = guest;
  if (!g.stay || !peer) return guestSet('exit', 999);
  if (quiet) return guestSet('sleep', 600);
  const r = Math.random();
  if (r < 0.35) return guestSet('sit', rand(150, 300));
  if (r < 0.6) return guestSet('lick', rand(90, 150));
  if (r < 0.85) { g.target = rand(20, W - 20); return guestSet('walk', 400); }
  guestSet('sleep', rand(600, 1200));
}
// 主人家的貓能不能過來打招呼：在家、在地上、閒著
const canMeet = () => !quiet && !cat.perch && !cat.in && cat.y >= FLOOR &&
  ['sit', 'lick', 'rest', 'walk', 'stare', 'beg', 'drool', 'dream', 'loaf', 'flop'].includes(cat.state);
function updateGuest() {
  const g = guest;
  if (!g) return;
  g.t++;
  if (g.t % RATE[g.state] === 0) g.frame++;
  g.stay = Math.max(0, g.stay - 1);
  switch (g.state) {
    case 'enter': {                                    // 從隔壁那一邊走進來，停在離邊邊一小段的地方
      const tx = g.edge > 0 ? W - 40 : 40;
      g.x -= g.edge * 0.6;
      if (g.edge > 0 ? g.x <= tx : g.x >= tx) {
        g.x = tx;
        if (canMeet()) { setState('meet', Math.abs(cat.x - g.x) / 0.8 + 120); guestSet('wait', cat.dur); }   // 主人家的貓走過來打招呼
        else guestIdle();
      }
      break;
    }
    case 'wait':                                       // 等主人家的貓走過來
      g.dir = Math.sign(cat.x - g.x) || g.dir;
      if (cat.state !== 'meet' || g.t > g.dur) guestIdle();
      break;
    case 'walk':
      g.dir = Math.sign(g.target - g.x) || g.dir;
      g.x += g.dir * 0.35;
      if (Math.abs(g.target - g.x) < 1 || g.t > g.dur) guestIdle();
      break;
    case 'exit':                                       // 回家：走出畫面，告訴隔壁牠回去了
      g.dir = g.edge;
      g.x += g.edge * 0.6;
      if (g.x > W + 16 || g.x < -16) { say({ t: 'home', to: g.from, energy: g.energy }); guest = null; }
      break;
    case 'pet':                                        // 被摸：瞇眼呼嚕，冒愛心
      if (g.t % 30 === 1) puff('heart', g.x + g.dir * rand(0, 6), g.y - 22);
      if (g.t > g.dur) guestIdle();
      break;
    default:                                           // sit、lick、sleep、boop：時間到了換下一件事
      if (g.t > g.dur) guestIdle();
  }
  if (g.state !== 'enter' && g.state !== 'exit') g.x = clamp(g.x, 12, W - 12);
}

  const f = g.frame;
  switch (g.state) {
    case 'enter': case 'exit': case 'walk': return standPose(f);
    case 'lick': return lickPose(f);
    case 'sleep': return sleepPose(f);
    case 'pet': return sitPose(f, 'pet');
    case 'boop': return eatPose(f, true);
    case 'wait': return sitPose(f, 'stare');
    default: return sitPose(f, 'sit');
  }
}
function guestBox() {                                  // 客人在哪裡點得到（坐著時照牠面向哪邊左右翻）
  const { x, y, state, dir } = guest;
  if (state === 'sleep') return { x0: x - 12, y0: y - 14, x1: x + 12, y1: y + 1 };
  if (['sit', 'lick', 'pet', 'wait'].includes(state)) return { x0: x - (dir > 0 ? 14 : 11), y0: y - 23, x1: x + (dir > 0 ? 11 : 14), y1: y + 1 };
  return { x0: x - 19, y0: y - 18, x1: x + 19, y1: y + 1 };
}
function drawGuest() {
  const g = guest, [parts, det] = look(guestPose(g), g.coat, 'guest', g.wear), ox = Math.round(g.x), oy = Math.round(g.y);
  drawRects(ox, oy, parts, det, g.dir, coatPal(g.coat));
  if (g.state === 'sleep') drawZ(ox + g.dir * 8, oy - 14, g.t);
}
function petGuest() {                                  // 摸客人、點一下客人：瞇眼呼嚕
  if (GUEST_PETTABLE.includes(guest.state) && guest.state !== 'pet') guestSet('pet', 180);
  rub.flips = 0;
}

/* ═══ 狀態視窗（桌寵版）：點系統匣圖示打開，看貓在做什麼、換玩具、餵貓條、安靜模式、換毛色和配件、收放家具、選螢幕 ═══
   畫面在 status.html。設定由 Rust 存在 settings.json（毛色、配件、家具、螢幕會記住；玩具、安靜模式不記），

const COAT_NAMES = { gray: '藍灰虎斑', orange: '橘貓', tuxedo: '黑白賓士' };   // DLC 的毛色名字也加在這裡
let lastSettings = null;                               // 最後一次收到的設定：DLC 跑完再套一次，選的是 DLC 的毛色、配件才換得過去
function applySettings(s) {                            // 開機時讀一次；之後狀態視窗改了設定，Rust 會再送一次
  if (!s) return;

  myWear = typeof s.wear === 'string' ? s.wear : null;

function doing() {                                     // 貓現在在做什麼

}
// 照姿勢畫一張貓的小圖（不含家具、毛球），回傳 data URL。who：'cat' 自己家的貓（狀態視窗）、'card' 毛色、配件選單（見「角色」的 dress）
function catPicture(coat = myCoat, pose = currentPose(), who = 'cat', wear) {
  const [parts, det, over] = look(pose, coat, who, wear);
  // 一層一層畫：貓、角色、玩具畫在貓前面的那層（叼著的小魚乾……）、自己家的貓用著的 DLC 家具的那層（舉著的槓鈴……）
  const layers = [[parts, det], over, who === 'cat' && furnAsk('over')].filter(Boolean);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [ps, ds] of layers) {
    for (const [x, y, w, h] of ps) { x0 = Math.min(x0, x - 1); y0 = Math.min(y0, y - 1); x1 = Math.max(x1, x + w + 1); y1 = Math.max(y1, y + h + 1); }
    for (const [x, y, w, h] of ds) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }

}
function catStatus() {                                 // 狀態視窗要顯示的東西
  const away = cat.state === 'away';

    doing: doing(), energy: Math.round(cat.energy),
    poop: litter.on ? litter.poop.length : null, dirty: DIRTY,   // 貓砂盆收起來了就是 null
    coat: myCoat, coatName: COAT_NAMES[myCoat] || myCoat, wear: worn() || 'none', wearName: WEAR[worn()] ? String(WEAR[worn()].name) : '不戴',
    toy, toys: Object.keys(TOYS).map(k => ({ id: k, name: String(TOYS[k].name || k) })),   // 「狀態」分頁的玩具按鈕：DLC 的玩具接在後面
    quiet, treat: !!treat,                             // 地上已經有一條貓條：「餵貓條」按不了
    picture: away ? null : catPicture(),               // 去隔壁作客時家裡沒有貓
    away, canVisit: !!canVisit(),                      // 「狀態」分頁的「叫牠回家」「叫牠去隔壁玩」按鈕
    dlc: dlcs.map(d => ({ file: d.file, names: dlcNames(d), error: d.error })),   // 「系統」分頁：載入了哪些 DLC

}
// 毛色選單：每種毛色戴著現在的配件；配件選單：現在的毛色戴著每一件（第一張是不戴）
const coatCards = () => Object.keys(COATS).map(k => ({ id: k, name: COAT_NAMES[k] || k, picture: catPicture(k, sitPose(0, 'sit'), 'card', worn()) }));
const wearCards = () => [{ id: 'none', name: '不戴' }, ...Object.keys(WEAR).map(k => ({ id: k, name: String(WEAR[k].name || k) }))]
  .map(w => ({ ...w, picture: catPicture(myCoat, sitPose(0, 'sit'), 'card', w.id) }));
let cardsFor = '';                                     // 選單的小圖是照哪個毛色、配件畫的：換了就重畫
function sendCards() {

}
if (TAURI) {

/* ═══ 貓咪日記（桌寵版）：外傳「午睡夢遊記」讀它，讓白天玩了什麼影響晚上的夢 ═══
   只記次數和時間，不記游標、不記圖片。這裡先累積，每分鐘把多出來的交給 Rust 加進
   圖片\YarnCat\diary.json（main.rs 的 diary_add）；狀態視窗「系統」可以關掉。
   欄位（_sec 結尾的是秒數，這裡先用格數記，送出去時才換成秒）：
   toy_ball_sec、toy_laser_sec、toy_wand_sec 跟毛球／雷射光／逗貓棒玩了多久，pets 被摸幾次、purr_sec 呼嚕多久，
   snacks 吃完幾根零食、treats 舔完幾條貓條，big_bubbles 點破幾個大泡泡，quiet_sec 安靜模式多久，
   litter 上幾次廁所、scratch 磨幾次爪、boo 躲紙箱嚇人幾次，flops 搆不到翻肚放棄幾次。
   之後要加欄位直接加；改了欄位的意思才要改 main.rs 的 DIARY_VERSION。 */
let diaryOn = false;                                   // 等設定讀進來才知道（見 applySettings）
const diary = {};                                      // 還沒寫進去的
let diaryBusy = false;                                 // 上一次還沒寫完就不再送
const PLAYING = ['stare', 'chase', 'crouch', 'pounce', 'swipe', 'hunt', 'aim', 'leap', 'clutch', 'slap', 'loaf'];   // 算在「玩玩具」的狀態
function note(k, n = 1) { if (diaryOn) diary[k] = (diary[k] || 0) + n; }
function diaryTick() {                                 // 每格：在玩哪個玩具、在呼嚕、安靜模式，各記一格
  if (!diaryOn || cat.state === 'away') return;        // 去隔壁作客時在別人家玩，不算
  if (playable() && PLAYING.includes(cat.state) && !cat.perch) note(`toy_${toy}_sec`);
  if (cat.state === 'pet') note('purr_sec');
  if (quiet) note('quiet_sec');
}
function today() {                                     // 本地時間的 YYYY-MM-DD
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function diaryFlush() {
  if (!TAURI || !diaryOn || diaryBusy) return;
  const add = {};
  for (const [k, v] of Object.entries(diary)) {
    const n = k.endsWith('_sec') ? Math.floor(v / 60) : v;   // 不滿一秒的留著，下次再送
    if (n > 0) add[k] = n;
  }
  if (!Object.keys(add).length) return;
  diaryBusy = true;
  TAURI.core.invoke('diary_add', { day: today(), add })
    .then(() => { for (const [k, n] of Object.entries(add)) diary[k] -= k.endsWith('_sec') ? n * 60 : n; })
    .catch(() => {})                                   // 寫不進去（例如 OneDrive 正在同步）：留著下一分鐘再送
    .finally(() => { diaryBusy = false; });
}
if (TAURI) setInterval(diaryFlush, 60000);

/* ═══ 角色：有自己個性的貓（老大貓、健身貓……都是 DLC 加進來的，見下面的「DLC」） ═══
   毛色在 COATS；毛色有登記在 CHARS 的，就多了專屬的外觀、動作和東西。主程式只在幾個地方問「現在這隻有沒有自己的」（hook）：
     idle()           nextIdle 擲骰子前：要做專屬的事就 setState 並回傳 true
     step()           updateCat 結尾：專屬狀態每一格要做的事
     off()            換成別的毛色時每一格都會叫：把專屬的東西收掉（要能重複叫）
     pose(f)          專屬狀態的姿勢；不是專屬狀態回傳 null
     dress(pose, who) 在任何姿勢上加外觀；who 是 'cat'（自己家的貓）、'guest'（隔壁來的客人）、'card'（毛色選單的小圖）。
                      回傳 [parts, det, over]，over 是畫在貓前面的一層（叼著的小魚乾）
     box()            專屬狀態的點擊範圍；不是回傳 null
     hitFront(p)      比貓優先點到的東西（嘴上的小魚乾）；hitBack(p) 比家具後面才點到的東西。回傳種類名稱或 null
     obj(kind)        拖曳時那個種類對應的物件；grab(kind, p) 按下去那一刻要先做的事；click(kind) 點一下（回傳 true 表示處理了）
     update()         物理（小魚乾掉落）；drawBack() 畫在貓後面、drawFront() 畫在貓前面；resize(oldS) 改縮放時
     key(k)           網頁版測試用的按鍵（閒著的時候才會叫）
   專屬物件要拖曳的話，在 HALF、TOP 登記半寬和最高能拎多高，拖曳就照家具的規則走。
   不管哪一隻貓都會用的東西（健身器材……）做成家具，見下面的「DLC 家具」。
   角色的程式出錯（多半是主程式改了名字，DLC 還在用舊的）就停掉那個角色（charFail）：貓變回一般的貓，畫面不會停住。

   DLC 的玩具（小魚乾……）也是同一套：TOYS.代號 = { name, 上面的函式… }，選了這個玩具才會問它（off 是換成別的玩具時）。
   代號只能用小寫英文字母。dress 只會給自己家的貓（who 是 'cat'），回傳的 over 跟角色的疊在一起（嘴上叼著的小魚乾）。
   角色、玩具都有的函式，先問角色；角色回答了（idle 回傳 true、pose 回傳姿勢……）就不問玩具，
   沒有回傳東西的（step、update、drawBack、drawFront、grab、resize、key）兩個都會叫。
   主程式的毛球、雷射光、逗貓棒才會讓貓盯著、追、撲（playable）；選了 DLC 的玩具，怎麼玩都由它自己來。
   玩具的程式出錯就拿掉那個玩具（toyFail），換回毛球。 */
const CHARS = {};
function charCall(k, name, ...args) {                  // 叫角色 k 的 name；沒有這個角色、沒有 name 就是 null
  const c = CHARS[k];
  if (!c || typeof c[name] !== 'function') return null;
  try { return c[name](...args); } catch (e) { charFail(k, e); return null; }
}
function toyCall(k, name, ...args) {                   // 叫 DLC 的玩具 k 的 name；主程式的玩具、沒有 name 就是 null
  const t = TOYS[k];
  if (!t || BASE_TOYS.has(k) || typeof t[name] !== 'function') return null;
  try { return t[name](...args); } catch (e) { toyFail(k, e); return null; }
}
function hook(name, ...args) { return charCall(myCoat, name, ...args) || toyCall(toy, name, ...args); }   // 問現在這隻、現在的玩具
function look(pose, coat, who, wear = who === 'cat' ? worn() : '') {   // 加上角色外觀、玩具（嘴上的小魚乾）、配件
  const dressed = charCall(coat, 'dress', pose, who);
  let [parts, det, over] = Array.isArray(dressed) ? dressed : pose;
  if (who === 'cat') {
    const t = toyCall(toy, 'dress', [parts, det], who);
    if (Array.isArray(t)) {
      [parts, det] = t;
      if (t[2]) over = over ? [[...over[0], ...t[2][0]], [...over[1], ...t[2][1]]] : t[2];
    }
  }
  const hat = putOn(parts, coat, wear, who);
  if (hat) { parts = [...parts, ...hat[0]]; det = [...det, ...hat[1]]; }
  return [parts, det, over];
}
function charStep() {                                  // updateCat 結尾：現在這隻跑 step，其他角色收掉自己的東西；玩具、擺出來的 DLC 家具也一樣
  for (const k of Object.keys(CHARS)) charCall(k, k === myCoat ? 'step' : 'off');
  for (const k of Object.keys(TOYS)) toyCall(k, k === toy ? 'step' : 'off');
  furnEach('step');
  // 專屬的狀態卻沒有人給姿勢（角色停掉了、家具收起來了）：掉回地上，變回一般的貓
  if (!BASE_STATES.has(cat.state) && !ownPose(cat.frame)) tumble();
}
const ownPose = f => hook('pose', f) || furnAsk('pose', f);   // 角色、DLC 家具的專屬狀態的姿勢
// 側臉的頭：8 寬、6～7 高的那一塊（正面、翻肚的臉不是）。角色外觀照它的位置加東西
const sideHead = parts => parts.find(([, , w, h, c]) => c === 'F' && w === 8 && (h === 6 || h === 7));
const frontHead = parts => parts.find(([, , w, h, c]) => c === 'F' && w === 9 && h === 8);   // 正面的臉：被拎起來、從紙箱蹦出來
const shift = (rects, dx, dy) => rects.map(r => [r[0] + dx, r[1] + dy, r[2], r[3], r[4]]);

/* ═══ 配件：戴在每一隻貓頭上的帽子……（DLC 加的，見「DLC」） ═══
   DLC 在 WEAR 加一件：WEAR.代號 = { name, hat(coat) }。代號只能用小寫英文字母，'none' 留給「不戴」。
   hat 回傳這個毛色戴起來的樣子 { side: [parts, det], front: [parts, det] }（同一件配件，不同毛色可以戴不一樣的）：
     side   戴在側臉的頭上（8 寬那塊），(0, 0) 是頭的左上角，面向右；耳朵在 (0, -2)、(5, -2)
     front  戴在正面的臉上（被拎起來、從紙箱蹦出來、躲在紙箱裡探頭），(0, 0) 是臉的左上角；耳朵在 (0, -2)、(7, -2)
   主程式照姿勢戴上去：翻肚躺著時 side 掉在臉旁邊的地上；找不到頭的姿勢（臥推……）就不戴。DLC 自己畫貓（躲在南瓜燈裡……）時用 hatOf。
   狀態視窗「配件」分頁選戴哪一件，記在 settings.json 的 wear：沒選過就戴第一件，'none' 是不戴。
   隔壁來的客人戴牠自己選的（hi、visit 帶過來；這邊沒裝那件就不戴）。配件的程式出錯就拿掉那一件（wearFail）。 */
const WEAR = {};
let myWear = null;                                     // 選的配件；null 是沒選過
const worn = () => myWear === null ? Object.keys(WEAR)[0] || '' : WEAR[myWear] ? myWear : '';   // 自己家的貓現在戴哪一件（'' 不戴）
function hatOf(coat, id) {                             // 配件 id 在這個毛色戴起來的樣子；不戴、沒有這件就是 null
  const w = WEAR[id];
  if (!w || typeof w.hat !== 'function') return null;
  try { return w.hat(coat) || null; } catch (e) { wearFail(id, e); return null; }
}
function putOn(parts, coat, id, who) {                 // 照姿勢把配件放好：[parts, det]，戴不上就是 null
  const hat = hatOf(coat, id);
  if (!hat) return null;
  if (who === 'cat' && onBack()) return [shift(hat.side[0], 17, 2), shift(hat.side[1], 17, 2)];   // 翻肚躺著：掉在臉旁邊的地上
  const side = sideHead(parts), front = !side && frontHead(parts);
  const [[p, d], [x, y]] = side ? [hat.side, side] : front ? [hat.front, front] : [[], []];
  return p ? [shift(p, x, y), shift(d, x, y)] : null;
}
function nextWear() {                                  // 網頁版：換下一件配件（最後是不戴）
  const keys = [...Object.keys(WEAR), 'none'];
  myWear = keys[(keys.indexOf(worn() || 'none') + 1) % keys.length];
}

/* ═══ DLC 家具：DLC 也能加家具（健身器材……），哪一隻貓都會用 ═══
   DLC 在 FURN 加一件：FURN.代號 = { name, desc, 下面的函式… }，在 HALF、TOP 登記半寬和拎起來最高到哪（沒登記就是 12、20）。
   代號只能用小寫英文字母（main.rs 的 set_furniture 只收這種，不然收起來存不了）。
   主程式補上 on、x、y、vx、vy、held，第一次擺在貓附近的空地；拖、甩、落地、改縮放都跟貓砂盆它們一樣。
   狀態視窗的「家具」分頁會多一列：name 是名字、desc 是底下的小字；收起來會記住。
   擺出來的每一件，主程式會在這些地方問它（this 就是那件家具；用不到的函式不用給）：
     draw()   畫出來：墊在主程式的家具後面
     hit(p)   p 點得到這件嗎（比主程式的家具後面才點到）。點到了就能拖；按下去沒怎麼動就放開算點一下，叫 click()，
              回傳 true 表示處理了，不然就照甩的速度飛出去
     idle()   nextIdle 擲骰子前（問過角色之後）：要來用就 setState 並回傳 true
     step()   updateCat 結尾，每一格：用這件家具的狀態要做的事
     pose(f)  用這件家具的狀態的姿勢；不是回傳 null
     box()    用這件家具時貓的點擊範圍；不是回傳 null
     over()   畫在貓前面的一層 [parts, det]（舉著的槓鈴……）；沒有回傳 null
     off()    收起來的那一刻
     key(k)   網頁版測試用的按鍵（閒著的時候才會叫）
   貓在家具上面、裡面時，cat.in 設成家具的代號：家具收起來、貓被拎起來就會掉下來（tumble 會清掉 cat.in）。
   新的狀態一樣加進 ZH、RATE。家具收起來、出錯時貓還在用的話，那個狀態沒有人給姿勢，貓就掉回地上（見 charStep）。
   家具的程式出錯就收掉那一件（furnFail），錯誤顯示在狀態視窗「系統」分頁。 */
const BASE_FURN = new Set(Object.keys(FURN));          // 主程式自己的家具；其他的是 DLC 加的
const furnOwner = {};                                  // DLC 的家具是哪個 DLC 加的：出錯時記在那個 DLC 上
const furnOn = () => Object.keys(FURN).filter(k => FURN[k].on);   // 擺出來的家具（主程式的家具沒有這些函式，問了也是 null）
function furnCall(k, name, ...args) {                  // 叫家具 k 的 name；沒有這件、沒有 name 就是 null
  const f = FURN[k];
  if (!f || typeof f[name] !== 'function') return null;
  try { return f[name](...args); } catch (e) { furnFail(k, e); return null; }
}
function furnAsk(name, ...args) {                      // 問每一件擺出來的家具，第一個有回答的算
  for (const k of furnOn()) { const r = furnCall(k, name, ...args); if (r) return r; }
  return null;
}
function furnEach(name, ...args) { for (const k of furnOn()) furnCall(k, name, ...args); }   // 每一件都叫
function furnFail(k, e) {                              // 家具的程式出錯：收掉這件（貓在上面就掉下來），狀態視窗也不列了
  console.error(e);
  const f = FURN[k];
  if (drag && drag.obj === f) { drag = null; document.body.classList.remove('grabbing'); }
  delete FURN[k];
  if (cat.in === k) tumble();
  const d = furnOwner[k];
  if (d && !d.error) d.error = `${f.name || k}收掉了，${dlcError(e, d)}`;
}
function freeSpot(half) {                              // 在貓附近找一塊空地擺家具：不壓到別的家具；擺不下就算了，疊著放
  const taken = furnOn().map(k => [FURN[k].x, HALF[k]]);
  const ok = x => x >= half && x <= W - half && taken.every(([tx, th]) => Math.abs(x - tx) >= half + th + 6);
  for (let d = 30; d < W; d += 3) for (const s of [1, -1]) { const x = Math.round(cat.x + s * d); if (ok(x)) return x; }
  return clamp(cat.x + 40, half, W - half);
}

/* ═══ DLC：一個 .yarncat 檔就是一個 DLC，放在 圖片\YarnCat\dlc（main.rs 的 read_dlc） ═══
   檔案裡是 JavaScript。開機時照檔名順序各跑一次，包在自己的函式裡：裡面的 const、function 不會跟主程式、別的 DLC 撞名，
   主程式的東西（cat、setState、standPose、COATS……）都用得到。DLC 通常會：
     - 在 COATS、COAT_NAMES 加毛色。毛色的代號只能用小寫英文字母（main.rs 的 set_coat 只收這種，不然選了存不起來）
     - 在 CHARS 登記角色、在 TOYS 加玩具（見「角色」）；新的顏色加進 C，新的狀態加進 ZH、RATE（要能摸、會忙的再加進 PETTABLE、BUSY）
     - 在 WEAR 加配件（見「配件」）
     - 在 FURN 加家具（見「DLC 家具」）
   主程式改名、刪掉 DLC 用到的東西，DLC 就會出錯：載入時出錯就整個不載入（加到一半的毛色、角色、家具拿掉），
   跑到一半出錯就停掉那個角色、收掉那件家具。錯誤都會顯示在狀態視窗「系統」分頁，找得到是第幾行就寫出來。
   DLC 能做的事跟主程式一樣多，只放信任的人給的。用 eval 跑：tauri.conf.json 之後要加 CSP 的話，script-src 要有 'unsafe-eval'。
   網頁版沒有 dlc 資料夾：把 .yarncat 檔拖進視窗，存在這個分頁裡再重新整理（之後重新整理也還在，關掉分頁就沒了）。 */
const dlcs = [];                                       // 載入過的 DLC：{ file, url, coats、toys、wears（加了哪些毛色、玩具、配件）, error }
const charOwner = {}, toyOwner = {}, wearOwner = {};   // 角色、玩具、配件是哪個 DLC 加的：出錯時記在那個 DLC 上
const BASE_STATES = new Set(Object.keys(RATE));        // 主程式自己的狀態；DLC 加的狀態要有角色在才有人管
// 改名、拆開了的舊 DLC：不載入，在「系統」分頁請你刪掉（不然會跟新的重複）
const RETIRED = { 'boss-gym.yarncat': '已經拆成 boss.yarncat（老大貓、小魚乾）和 gym.yarncat（健身貓、健身器材），刪掉這個舊檔就好' };
const isDlc = f => /\.yarncat$/i.test(f.name);
const dlcNames = d => [...d.coats.map(k => COAT_NAMES[k] || k), ...d.toys.map(k => TOYS[k] ? String(TOYS[k].name) : k),
  ...d.wears.map(k => WEAR[k] ? String(WEAR[k].name) : k)];   // 「系統」分頁的「已載入」：加了哪些毛色、玩具、配件
function runDlc(file, code) {
  const d = { file, url: 'dlc/' + file.replace(/[^\w.-]/g, '_'), coats: [], toys: [], wears: [], error: '' };
  dlcs.push(d);
  if (RETIRED[file.toLowerCase()]) { d.error = RETIRED[file.toLowerCase()]; return; }
  const coats = new Set(Object.keys(COATS)), chars = new Set(Object.keys(CHARS)), furn = new Set(Object.keys(FURN));
  const toys = new Set(Object.keys(TOYS)), wears = new Set(Object.keys(WEAR));
  try {
    // 間接 eval：在全域跑，看得到主程式的 const、let。包函式的那一行接著檔案的第一行，錯誤的行號才對得上檔案
    (0, eval)(`(function () {${code}\n})\n//# sourceURL=${d.url}`)();
    for (const [what, list, had] of [['FURN', FURN, furn], ['TOYS', TOYS, toys], ['WEAR', WEAR, wears]])
      for (const k of Object.keys(list)) if (!had.has(k) && !(list[k] && typeof list[k] === 'object')) throw new Error(`${what}.${k} 不是物件`);
    if (WEAR.none) throw new Error('WEAR.none 是「不戴」，換一個代號');
  } catch (e) {
    d.error = dlcError(e, d);
    console.error(e);
    for (const [list, had] of [[CHARS, chars], [COATS, coats], [FURN, furn], [TOYS, toys], [WEAR, wears]])
      for (const k of Object.keys(list)) if (!had.has(k)) delete list[k];
    return;
  }
  d.coats = Object.keys(COATS).filter(k => !coats.has(k));
  d.toys = Object.keys(TOYS).filter(k => !toys.has(k));
  d.wears = Object.keys(WEAR).filter(k => !wears.has(k));
  for (const k of Object.keys(CHARS)) if (!chars.has(k)) charOwner[k] = d;
  for (const k of d.toys) toyOwner[k] = d;
  for (const k of d.wears) wearOwner[k] = d;
  for (const k of Object.keys(FURN)) if (!furn.has(k)) {   // DLC 的家具：補上位置，一件一件擺在貓附近的空地
    furnOwner[k] = d;
    HALF[k] = HALF[k] || 12; TOP[k] = TOP[k] || 20;
    Object.assign(FURN[k], { on: true, x: freeSpot(HALF[k]), y: FLOOR, vx: 0, vy: 0, held: false });
  }
}
function dlcError(e, d) {                              // 錯誤訊息；錯在 DLC 裡面的話加上第幾行
  const msg = (e && e.message) || String(e);
  const line = parseInt(String(e && e.stack).split(d.url + ':')[1], 10);
  return line ? `第 ${line} 行：${msg}` : msg;
}
function charFail(k, e) {                              // 角色的程式出錯：停掉這個角色（毛色還在），下一格 charStep 會讓貓回到平常的樣子
  console.error(e);
  delete CHARS[k];
  const d = charOwner[k];
  if (d && !d.error) d.error = `${COAT_NAMES[k] || k}停掉了，${dlcError(e, d)}`;
}
function toyFail(k, e) {                               // 玩具的程式出錯：拿掉這個玩具，正在玩的話換回毛球
  console.error(e);
  const name = TOYS[k].name || k;
  delete TOYS[k];
  if (toy === k) { toy = ''; setToy('ball'); }         // 先清掉：setToy 換成同一個玩具不會做事
  const d = toyOwner[k];
  if (d && !d.error) d.error = `${name}拿掉了，${dlcError(e, d)}`;
}
function wearFail(k, e) {                              // 配件的程式出錯：拿掉這一件，貓就不戴了
  console.error(e);
  const name = WEAR[k].name || k;
  delete WEAR[k];
  const d = wearOwner[k];
  if (d && !d.error) d.error = `${name}拿掉了，${dlcError(e, d)}`;
}
function loadDlc() {                                   // 開機時跑一次
  if (!TAURI) {
    const saved = savedDlc();
    for (const file of Object.keys(saved).sort()) runDlc(file, saved[file]);
    return dlcLoaded();
  }
  TAURI.core.invoke('read_dlc')
    .then(list => { for (const f of list) f.error ? dlcs.push({ file: f.file, coats: [], toys: [], wears: [], error: f.error }) : runDlc(f.file, f.code); })
    .catch(() => {})
    .finally(dlcLoaded);
}
function dlcLoaded() {                                 // DLC 都跑完了：顏色表重算（DLC 可能在 C 加了顏色），再套一次選過的毛色（DLC 的毛色現在才認得）
  for (const k of Object.keys(pals)) delete pals[k];
  if (!TAURI) return sessionCoat();
  applySettings(lastSettings);
  sendCards();                                         // 狀態視窗比 DLC 先開好的話，毛色、配件選單要補上
}
function savedDlc() {                                  // 網頁版：這個分頁拖進來過的 DLC { 檔名: 程式碼 }
  try { return JSON.parse(sessionStorage.getItem('yarncat-dlc')) || {}; } catch (_) { return {}; }
}
async function addDlc(files) {                         // 網頁版：拖進來的 DLC 存在這個分頁裡，重新整理從頭載入（同名的蓋掉舊的）
  const saved = savedDlc();
  for (const f of files) saved[f.name] = await f.text();
  try { sessionStorage.setItem('yarncat-dlc', JSON.stringify(saved)); location.reload(); }
  catch (_) { for (const f of files) runDlc(f.name, saved[f.name]); dlcLoaded(); }   // 存不起來：直接跑，重新整理就沒了
}

/* ═══ 遊戲迴圈：固定每秒 60 次更新，畫面跟著螢幕刷新 ═══
   下一格先排好、每一格先扣掉時間再更新：哪一格出錯（例如 DLC 的程式）也不會整個停住，也不會越積越多格要補 */
let acc = 0, lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(now - lastT, 100); lastT = now;
  while (acc >= 1000 / 60) {
    acc -= 1000 / 60;
    if (toy === 'ball') updateBall();
    else if (toy === 'laser') updateLaser();
    else if (toy === 'wand') updateWand();
    updateCat();
    updateGuest();
    linkTick();
    updateFurniture();
    hook('update');                                    // 角色、DLC 玩具的東西：小魚乾的物理
    updateFx();
    diaryTick();
  }
  ctx.clearRect(0, 0, W, H);
  furnEach('draw');                                    // 家具墊在最底下，DLC 的家具又在主程式的後面；貓進了貓砂盆、紙箱，再把前面那片蓋上去
  if (tree.on) drawTree();
  if (litter.on) drawLitter(false);
  if (box.on) drawBox(false);
  for (const q of poos) drawPoo(Math.round(q.x), Math.round(q.y));
  if (toy === 'ball') { drawRope(); drawBall(); }
  if (snack) drawSnack(Math.round(snack.x) - 3, Math.round(snack.y), snack.bites);
  if (treat && !treat.held) drawTreat();
  hook('drawBack');                                    // 角色、DLC 玩具的東西：地上的小魚乾
  if (guest) drawGuest();                              // 客人畫在家裡的貓後面
  if (cat.state === 'hide') drawPeek(); else drawCat();
  if (litter.on && cat.in === 'litter') drawLitter(true);
  if (box.on && cat.in === 'box') drawBox(true);
  if (treat && treat.held) drawTreat();                // 拿在手上的貓條在貓前面
  hook('drawFront');                                   // 角色、DLC 玩具的東西：被你拿著的小魚乾、瞪你的十字
  drawScoop();
  drawFx();
  drawBubble();
  if (toy === 'laser') drawLaser();                    // 紅點照在貓身上，所以畫在貓上面
  if (toy === 'wand') drawWand();
  shakeView();
}

resize();
cat.x = W * 0.35; cat.y = FLOOR;
ball.x = W * 0.6; ball.y = FLOOR - ball.r;
tree.x = clamp(W * 0.07, HALF.tree, W - HALF.tree);   // 貓跳台、貓砂盆擺左邊，紙箱擺右邊
litter.x = clamp(W * 0.2, HALF.litter, W - HALF.litter);
box.x = clamp(W * 0.88, HALF.box, W - HALF.box);
tree.y = litter.y = box.y = FLOOR;
initRope();
initPom();
mouse.x = W * 0.7; mouse.y = 8;                        // 還沒收到游標位置前先放這裡
initWand();
started = true;
setState('stare', 60);
window.addEventListener('resize', resize);
watchDpr();
loadDlc();                                             // 場景擺好才跑 DLC：DLC 一開始就可能用到 W、FLOOR
requestAnimationFrame(frame);
</script>
</body>
</html>
