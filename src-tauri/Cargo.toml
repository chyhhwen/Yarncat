[package]
name = "yarncat"
version = "1.6.0"
description = "毛球貓：在螢幕底部玩毛球的桌寵"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
# 設定檔（毛色、家具、螢幕）存成 JSON；串門子的訊息也是一行一則 JSON
serde_json = "1"
# 串門子找人：列出每張網卡的廣播位址（255.255.255.255 只會從一張網卡送出去，VMware 的虛擬網卡收不到）
if-addrs = "0.15"

# macOS 直接向 AppKit 問游標在視窗裡的位置（見 main.rs 的 cursor_in_strip）；跟 Tauri 用同一版
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
strip = true
lto = true
opt-level = "s"
